apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: trading
  labels:
    app: kafka
spec:
  type: NodePort
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
      nodePort: 30092

---

apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: trading
  labels:
    app: kafka-ui
spec:
  type: NodePort
  selector:
    app: kafka-ui
  ports:
    - name: ui
      port: 8080
      targetPort: 8080
      nodePort: 30080
