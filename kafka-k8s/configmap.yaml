apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-broker-config
  namespace: trading
data:
  # ── KRaft mode (sin Zookeeper) ──────────────────────────────────
  KAFKA_NODE_ID: "1"
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
  KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
  KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
  CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

  # ── Broker ──────────────────────────────────────────────────────
  KAFKA_LOG_DIRS: "/var/lib/kafka/data"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
  KAFKA_NUM_PARTITIONS: "3"
  KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
  KAFKA_LOG_RETENTION_HOURS: "24"
  # Límite de bytes por partición: 150 MiB × 10 particiones = ~1.5 GiB máximo,
  # dejando margen dentro del PVC de 2Gi. Sin este límite el disco se llena
  # silenciosamente y Kafka crashea.
  KAFKA_LOG_RETENTION_BYTES: "157286400"
  # Limita el heap JVM explícitamente.
  # Sin esto la JVM toma hasta el 25% de la RAM del nodo y causa OOMKill
  # al crear topics. Dejar ~400Mi libres para off-heap (page cache, netty).
  KAFKA_HEAP_OPTS: "-Xms256m -Xmx600m"
  # MaxDirectMemorySize acota la memoria off-heap de Netty/NIO.
  # Sin esto, los buffers directos crecen sin límite y el contenedor recibe OOMKill
  # aunque el heap esté dentro de los límites.
  KAFKA_JVM_PERFORMANCE_OPTS: "-XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:+ExplicitGCInvokesConcurrent -XX:MaxDirectMemorySize=256m -Djava.awt.headless=true"

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-ui-config
  namespace: trading
data:
  KAFKA_CLUSTERS_0_NAME: "trading-local"
  KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
  DYNAMIC_CONFIG_ENABLED: "true"
