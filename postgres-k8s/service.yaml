apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: trading
  labels:
    app: postgres
spec:
  # NodePort exposes PostgreSQL on every node's IP at port 30432.
  # Access from Windows: postgresql://trading_user:trading_pass_local@<minikube-ip>:30432/trading_db
  # Get minikube IP with: minikube ip
  type: NodePort
  selector:
    app: postgres
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
      nodePort: 30432
